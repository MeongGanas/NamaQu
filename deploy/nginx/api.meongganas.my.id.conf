# /etc/nginx/sites-available/api.meongganas.my.id
#
# Satu domain untuk semua backend: https://api.meongganas.my.id/<nama-app>/...
# Cloudflare Tunnel meneruskan api.meongganas.my.id -> http://localhost:8090
#
# Tiap app cukup ditambahkan sebagai symlink di /var/www/api-root:
#   /var/www/api-root/namaqu -> /var/www/namaqu/backend/public
server {
    listen 127.0.0.1:8090;
    server_name api.meongganas.my.id;

    root /var/www/api-root;
    index index.php;
    charset utf-8;
    client_max_body_size 25m;

    access_log off;          # hemat tulis ke eMMC
    error_log /var/log/nginx/api-error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        default_type text/plain;
        return 200 "api.meongganas.my.id\n";
    }

    # ---------------------------------------------------------------- NamaQu
    location ^~ /namaqu/storage/ {
        # foto upload (disimpan di HDD lewat symlink); cache lama di Cloudflare/Vercel
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /namaqu/ {
        try_files $uri $uri/ /namaqu/index.php?$query_string;

        location ~ ^/namaqu/(css|js|fonts)/ {
            expires 7d;
            try_files $uri =404;
        }

        location ~ \.php$ {
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        }
    }
    # ---------------------------------------------------------------- /NamaQu

    location ~ /\.(?!well-known) {
        deny all;
    }
}
