# /etc/nginx/snippets/namaqu-proxy.conf
#
# Dipasang di server block port 80 yang sudah melayani api.meongganas.my.id
# (Cloudflare Tunnel -> 127.0.0.1:80), dengan satu baris:
#     include snippets/namaqu-proxy.conf;
# Request /namaqu/... diteruskan ke server NamaQu di 127.0.0.1:8090
# (lihat api.meongganas.my.id.conf). Aplikasi lain di domain yang sama tidak terganggu.

location ^~ /namaqu/ {
    # upload foto di admin (default nginx hanya 1 MB)
    client_max_body_size 25m;

    # tanpa "/" di akhir: path /namaqu/... diteruskan utuh (Laravel NamaQu berjalan di /namaqu)
    proxy_pass http://127.0.0.1:8090;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # cloudflared sudah mengirim "https"; $scheme di sini akan bernilai "http"
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_read_timeout 60s;
}
