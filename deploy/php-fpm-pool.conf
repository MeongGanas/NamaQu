; Tempel/sesuaikan di /etc/php/8.5/fpm/pool.d/www.conf
; Mode ondemand: proses PHP hanya hidup saat ada request -> RAM idle hampir nol.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 300

; --- dan di /etc/php/8.5/fpm/conf.d/99-namaqu.ini ---
; upload_max_filesize = 20M
; post_max_size = 25M
; memory_limit = 192M
; opcache.enable = 1
; opcache.memory_consumption = 64
; opcache.interned_strings_buffer = 8
; opcache.max_accelerated_files = 10000
; opcache.validate_timestamps = 1   ; aman untuk aplikasi PHP lain di server yang sama
; opcache.revalidate_freq = 60       ; cek perubahan file paling sering tiap 60 detik
